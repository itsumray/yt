<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Search Modal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="search-container">
    <input type="text" id="search-input" placeholder="Search YouTube..." />
    <button onclick="searchYouTube()">Search</button>
    <button id="recommend-btn" class="hidden" onclick="getRecommended()">Recommended</button>
  </div>

  <!-- Modal for Video Results -->
  <div id="modal" class="modal hidden">
    <div id="video-results">
      <iframe id="video-frame" width="560" height="315" frameborder="0" allowfullscreen></iframe>
    </div>
    <button id="load-more" onclick="loadMore()">Show More</button>
    <button onclick="closeModal()">Close</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
